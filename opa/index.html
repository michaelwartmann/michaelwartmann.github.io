const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"])}
const dec=(k,u)=>crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k,u.slice(12));
async function open_(pw,keep){const msg=document.getElementById("msg");msg.textContent=W.busy;
 let k,html;try{k=await key(pw);html=new TextDecoder().decode(await dec(k,b64(BLOB)))}catch(e){msg.textContent=W.bad;try{localStorage.removeItem("opa-pw")}catch(_){}return}
 if(keep){try{localStorage.setItem("opa-pw",pw)}catch(_){}}
 const urls=await Promise.all(Object.entries(IMGS).map(async([src,f])=>{const b=new Uint8Array(await (await fetch(f)).arrayBuffer());
   return [src,URL.createObjectURL(new Blob([await dec(k,b)],{type:"image/jpeg"}))]}));
 for(const[src,u]of urls)html=html.split('src="'+src+'"').join('src="'+u+'"');
 document.open();document.write(html);document.close()}
document.getElementById("f").onsubmit=e=>{e.preventDefault();open_(document.getElementById("pw").value,document.getElementById("keep").checked)};
const hp=new URLSearchParams(location.hash.slice(1)).get("pw");
if(hp){history.replaceState(null,"",location.pathname);open_(hp,true)}
else{try{const s=localStorage.getItem("opa-pw");if(s)open_(s,false)}catch(_){}}
