async function key(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

const dec=(k,u)=>crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k,u.slice(12));
async function open_(pw,keep){const msg=document.getElementById("msg");msg.textContent=W.busy;

 if(keep){try{localStorage.setItem("opa-pw",pw)}catch(_){}}
