let lang = store.lang || ((navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2).toLowerCase()).find(l => UI[l]) || "en");
const t = k => UI[lang][k] || UI.en[k] || k;
const L = o => (o && (o[lang] || o.en)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

/* ---------- questionnaire ---------- */
const yn = [{ v: "yes", en: "Yes", de: "Ja" }, { v: "no", en: "No", de: "Nein" }];
const Q = [
  { group: { en: "Your household", de: "Dein Haushalt" } },
  { id: "adults", type: "num", def: 1, min: 1, en: "Adults (14 and over)", de: "Erwachsene (ab 14)" },
  { id: "kids", type: "num", def: 0, min: 0, en: "Children (under 14)", de: "Kinder (unter 14)" },
  { id: "days", type: "choice", def: "28", en: "Plan for how long?", de: "Für wie lange planen?",

function gaps(a) {
  const out = [], add = (sec, s, en, de) => out.push({ sec, s, en, de });
  const people = Math.max(1, (+a.adults || 0) + (+a.kids || 0)), days = +a.days || 28;

  // Water: BBK 2 L/person/day. Target 14 days stored + a way to treat water.
  const wl = +a.water_l || 0, wDays = Math.floor(wl / (people * 2)), goal = Math.min(14, days), need = people * 2 * goal;
  if (wDays >= goal) add("water", "g", `Stored water lasts about ${dEn(wDays)}.`, `Wasservorrat reicht etwa ${dDe(wDays)}.`);
  else add("water", wDays >= 3 ? "a" : "r",
    `Water lasts about ${dEn(wDays)}. Add ${Math.ceil(need - wl)} L (crates of bottled water) to reach ${goal} days. At the first sign of an outage, fill pots, bottles and the bathtub.`,
    `Wasser reicht etwa ${dDe(wDays)}. ${Math.ceil(need - wl)} L dazukaufen (Kisten Mineralwasser) für ${goal} Tage. Beim Stromausfall sofort Töpfe, Flaschen und Badewanne füllen.`);
  if (a.treat === "none") add("water", days > 14 ? "r" : "a", "No way to make water safe. A simple water filter or disinfection tablets cost about €10–30.", "Keine Möglichkeit, Wasser trinkbar zu machen. Ein einfacher Wasserfilter oder Entkeimungstabletten kosten etwa 10–30 €.");
  else if (a.treat === "boil") add("water", "a", "Boiling only works while you have fuel. Add a filter or tablets as backup.", "Abkochen geht nur, solange Brennstoff da ist. Filter oder Tabletten als Reserve.");
  if (a.floor === "high") add("water", "a", "Upper floors lose water pressure first. Store more water and fill containers early.", "Obere Stockwerke verlieren zuerst den Wasserdruck. Mehr Wasser lagern und früh Behälter füllen.");
  // Warmth
  const heatOff = a.heat && a.heat !== "wood";
  if (heatOff) add("warmth", a.sleep === "all" ? "a" : "r",
    "Your heating will stop. Plan one warm room for everyone: wool layers, hats, blankets on windows, a warm sleeping bag per person (~€40, comfort around 0 °C).",
    "Deine Heizung fällt aus. Plane einen warmen Raum für alle: Wolle in Schichten, Mützen, Decken vor die Fenster, ein warmer Schlafsack pro Person (~40 €, Komfort um 0 °C).");
  else if (a.heat === "wood") add("warmth", a.sleep === "all" ? "g" : "a", "Your stove works without power. Make sure you have dry wood for the full period.", "Dein Ofen läuft ohne Strom. Genug trockenes Holz für den ganzen Zeitraum bereithalten.");
  if (!heatOff && a.sleep && a.sleep !== "all") add("warmth", "a", "Get a warm sleeping bag or thick duvet for everyone.", "Warmen Schlafsack oder dicke Decke für alle besorgen.");

  if (a.safety === "none") add("tech", "r", "Get a battery CO alarm (~€25) and a fire blanket (~€15). Never use grills, gas heaters or generators indoors.", "CO-Melder mit Batterie (~25 €) und Löschdecke (~15 €) besorgen. Nie Grill, Gasheizer oder Generator in Innenräumen.");
  else if (a.safety === "one") add("tech", "a", "Complete the pair: battery CO alarm + fire blanket or extinguisher.", "Paar vervollständigen: CO-Melder + Löschdecke oder Feuerlöscher.");
  // Toilet
  if (a.toilet === "no") add("toilet", "r", "Prepare an emergency toilet: bucket, strong bin bags, cat litter or sawdust (~€15). Plus soap, wet wipes, disinfectant.", "Nottoilette vorbereiten: Eimer, feste Müllbeutel, Katzenstreu oder Sägespäne (~15 €). Dazu Seife, Feuchttücher, Desinfektion.");

  if (a.food) {
    const f = +a.food, k = people * days / 10, g = Math.round(3.5 * k), v = Math.round(4 * k), n = Math.round(2.4 * k);
    if (f >= Math.min(20, days)) add("food", "g", "Food stock looks good. Eat from it and refill, so nothing expires.", "Vorrat sieht gut aus. Davon essen und nachkaufen, damit nichts abläuft.");
    else add("food", f <= 3 ? "r" : "a",
      `For ${days} days your household needs roughly ${g} kg grains (rice, oats, pasta), ${v} kg vegetables and pulses (tins, jars, lentils), ${n} kg fruit and nuts. Full list in the stock calculator.`,
      `Für ${days} Tage braucht dein Haushalt etwa ${g} kg Getreide (Reis, Haferflocken, Nudeln), ${v} kg Gemüse und Hülsenfrüchte (Dosen, Gläser, Linsen), ${n} kg Obst und Nüsse. Ganze Liste im Vorrats-Rechner.`);
  }
  if (a.cook === "no") add("food", "a", "Get a camping stove + gas cartridges (~€30). Use it only with fresh air.", "Campingkocher + Gaskartuschen besorgen (~30 €). Nur bei guter Lüftung benutzen.");
  // Light, info, power
  if (a.light === "no") add("light", "a", "A headlamp per person + spare batteries. Safer than candles.", "Eine Stirnlampe pro Person + Ersatzbatterien. Sicherer als Kerzen.");
  if (a.radio === "no") add("light", "a", "Get a crank or battery radio (~€25). Radio keeps broadcasting when phones fail.", "Kurbel- oder Batterieradio besorgen (~25 €). Radio sendet weiter, wenn Handys ausfallen.");
  if (a.cash === "no") add("light", "a", "Keep some cash at home in small notes.", "Etwas Bargeld in kleinen Scheinen zu Hause haben.");
  if (a.power === "none") add("light", "r", "Get a 20,000 mAh power bank (~€25) and keep it charged.", "Powerbank mit 20.000 mAh besorgen (~25 €) und geladen halten.");
  else if (a.power === "small" || (a.power === "big" && days > 10)) add("light", "a", "For weeks, a power bank alone won't do. A foldable 20–30 W solar panel (~€60) keeps phone and lamps going.", "Für Wochen reicht eine Powerbank nicht. Ein faltbares 20–30-W-Solarpanel (~60 €) hält Handy und Lampen am Laufen.");
  // Health
  if (a.aid === "none") add("health", "r", "Get a first-aid kit (a car kit, DIN 13164, is a fine start) and book a first-aid course.", "Verbandkasten besorgen (Kfz-Verbandkasten DIN 13164 reicht für den Anfang) und Erste-Hilfe-Kurs buchen.");
  else if (a.aid === "kit") add("health", "a", "Book a first-aid course: when 112 is slow, you are the help.", "Erste-Hilfe-Kurs buchen: wenn 112 nicht schnell kommt, bist du die Hilfe.");
  // People & comms
  if (a.neigh === "0") add("comms", "r", "Introduce yourself to three neighbours. Swap names, flat numbers and what each of you can do.", "Stell dich drei Nachbarn vor. Namen, Wohnungen und Fähigkeiten austauschen.");
  else if (a.neigh === "1") add("comms", "a", "Get to know one or two more neighbours, and agree on a meeting place and time.", "Lerne ein, zwei Nachbarn mehr kennen und vereinbart Treffpunkt und Uhrzeit.");
  if (a.meet === "no") add("comms", "a", "Look up your town's emergency point (Notfall-Treffpunkt / Kat-Leuchtturm) and write it on your communication card.", "Notfall-Treffpunkt / Kat-Leuchtturm deiner Gemeinde nachschlagen und auf die Kommunikationskarte schreiben.");
  if (a.tools === "no") add("tech", "a", "Put together a small toolbox and find the main water valve, fuse box and gas valve today.", "Kleinen Werkzeugkasten zusammenstellen und heute Hauptwasserhahn, Sicherungskasten und Gashahn suchen.");
  if (a.mind === "no") add("mind", "a", "Books, cards and board games. A daily routine helps adults and children alike.", "Bücher, Karten, Brettspiele. Ein fester Tagesablauf hilft Großen und Kleinen.");
  const rank = { r: 0, a: 1, g: 2 }, prio = ["water", "warmth", "tech", "toilet", "food", "light", "health", "comms", "mind"];
  return out.sort((x, y) => rank[x.s] - rank[y.s] || prio.indexOf(x.sec) - prio.indexOf(y.sec));
}

/* ---------- stock calculator (BBK checklist per person per 10 days) ---------- */
const STOCK = [
  { en: "Drinking water", de: "Trinkwasser", per10: 20, unit: "L" },
  { en: "Grains: rice, oats, pasta, crispbread, potatoes", de: "Getreide: Reis, Haferflocken, Nudeln, Knäckebrot, Kartoffeln", per10: 3.5, unit: "kg" },
  { en: "Vegetables and pulses: tins, jars, lentils", de: "Gemüse und Hülsenfrüchte: Dosen, Gläser, Linsen", per10: 4.0, unit: "kg" },
  { en: "Fruit and nuts: tins, dried fruit, nuts", de: "Obst und Nüsse: Dosen, Trockenobst, Nüsse", per10: 2.4, unit: "kg" },
  { en: "Milk and dairy: UHT milk, hard cheese", de: "Milch und Milchprodukte: H-Milch, Hartkäse", per10: 2.6, unit: "kg" },
  { en: "Fish, meat, eggs (or more pulses): tins", de: "Fisch, Fleisch, Eier (oder mehr Hülsenfrüchte): Dosen", per10: 1.5, unit: "kg" },
  { en: "Fat and oil", de: "Fett und Öl", per10: 0.36, unit: "kg" }
];
function otherStock(people, days) {
  const weeks = Math.ceil(days / 7);
  return [
    [{ en: "Gas cartridges for the camping stove", de: "Gaskartuschen für den Campingkocher" }, `~${Math.max(2, Math.ceil(weeks * (people <= 2 ? 1.5 : 2.5)))}`],
    [{ en: "Strong bin bags for the toilet", de: "Feste Müllbeutel für die Toilette" }, `~${people * days}`],
    [{ en: "Cat litter or sawdust", de: "Katzenstreu oder Sägespäne" }, `~${weeks * 10} L`],
    [{ en: "Toilet paper", de: "Toilettenpapier" }, `~${Math.ceil(people * days / 5)} ${lang === "de" ? "Rollen" : "rolls"}`],
    [{ en: "Headlamps", de: "Stirnlampen" }, `${people}`],
    [{ en: "Spare AA/AAA batteries", de: "Ersatzbatterien AA/AAA" }, `~${people * weeks * 4}`],
    [{ en: "Sleeping bags (comfort ~0 °C)", de: "Schlafsäcke (Komfort ~0 °C)" }, `${people}`],
    [{ en: "Water filter or disinfection tablets", de: "Wasserfilter oder Entkeimungstabletten" }, "1"],
    [{ en: "Power bank 20,000 mAh + solar panel 20–30 W", de: "Powerbank 20.000 mAh + Solarpanel 20–30 W" }, "1"],
    [{ en: "Crank or battery radio", de: "Kurbel- oder Batterieradio" }, "1"],
    [{ en: "Battery CO alarm, fire blanket", de: "CO-Melder mit Batterie, Löschdecke" }, "1 + 1"]
  ];
}

/* ---------- views ---------- */
const app = document.getElementById("app");
const backBtn = () => `<p class="back"><a class="btn" href="#">${t("back")}</a></p>`;
const tile = (href, icon, title, sub, big) => `<a class="tile${big ? " big" : ""}" href="${href}"><span class="i" aria-hidden="true">${icon}</span><b>${esc(title)}</b><span>${esc(sub)}</span></a>`;

function viewHome() {
  let h = `<h1>${esc(t("tagline"))}</h1><p class="lead">${esc(t("homeIntro"))}</p><nav class="tiles" aria-label="Sections">`;
  h += tile("#check", "✅", t("check"), t("checkSub"), true);
  h += tile("#ready", "🧮", t("ready"), t("readySub"));
  h += tile("#now", SEC.now.icon, L(SEC.now.t), L(SEC.now.lead));
  for (const s of SECTIONS) if (s.id !== "now") h += tile("#" + s.id, s.icon, L(s.t), L(s.lead));
  h += tile("#card", "🗒", t("card"), t("cardSub"));
  h += tile("#all", "🖨", t("all"), t("allSub"));
  h += `</nav><details class="card"><summary>${esc(t("install"))}</summary><p>${esc(t("inst1"))}</p><p>${esc(t("inst2"))}</p><p>${esc(t("inst3"))}</p></details>`;
  return h;
}
function sectionHTML(s) {
  let h = `<section class="sec" id="s-${s.id}"><h1><span aria-hidden="true">${s.icon}</span> ${esc(L(s.t))}</h1><p class="lead">${esc(L(s.lead))}</p>`;
  for (const p of s.parts) h += `<div class="card"><h2>${esc(L(p.h))}</h2><ul>${(p.li[lang] || p.li.en).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  h += `<div class="src"><b>${t("sources")}</b> (${t("checked")} ${CHECKED})<ul>${s.src.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></section>`;
  return h;
}
function viewCheck() {
  let h = `<h1>${esc(t("check"))}</h1><p class="lead">${esc(t("checkLead"))}</p><form id="qform">`;
  for (const q of Q) {
    if (q.group) { h += `<h2>${esc(L(q.group))}</h2>`; continue; }
    if (store.ans[q.id] === undefined && q.def !== undefined) store.ans[q.id] = String(q.def);
    const hint = q.hint ? `<p class="hint">${esc(L(q.hint))}</p>` : "";
    if (q.type === "num") h += `<fieldset><legend><label for="q-${q.id}">${esc(L(q))}</label></legend>${hint}<input id="q-${q.id}" name="${q.id}" type="number" inputmode="numeric" min="${q.min}" step="1" value="${esc(store.ans[q.id] ?? "")}"></fieldset>`;
    else h += `<fieldset><legend>${esc(L(q))}</legend>${hint}${q.opts.map(o => `<label class="opt"><input type="radio" name="${q.id}" value="${o.v}"${store.ans[q.id] === o.v ? " checked" : ""}> ${esc(L(o))}</label>`).join("")}</fieldset>`;
  }
  h += `<div class="actions"><button class="primary" type="submit">${esc(t("showGaps"))}</button></div></form><section id="result" aria-live="polite"></section>`;
  return h;
}
function resultHTML() {
  const list = gaps(store.ans), c = s => list.filter(x => x.s === s).length;
  let h = `<h2>${esc(t("gapsH"))}</h2><div class="sum"><span class="chip">${t("R")}: ${c("r")}</span><span class="chip">${t("A")}: ${c("a")}</span><span class="chip">${t("G")}: ${c("g")}</span></div>`;
  if (!c("r") && !c("a")) h += `<p>${esc(t("allok"))}</p>`;
  h += list.map(x => `<div class="gap ${x.s}"><span class="tag">${t(x.s.toUpperCase())} · ${esc(L(SEC[x.sec].t))}</span><p>${esc(x[lang] || x.en)}</p><p class="noprint"><a href="#${x.sec}">${esc(L(SEC[x.sec].t))} →</a></p></div>`).join("");
  h += `<div class="actions"><button type="button" onclick="window.print()">${esc(t("print"))}</button><a class="btn" href="#ready">${esc(t("ready"))} →</a></div>`;
  return h;
}
function viewReady() {
  const a = store.ans, ad = +a.adults || 1, kd = +a.kids || 0, days = +a.days || 28;
  return `<h1>${esc(t("ready"))}</h1><p class="lead">${esc(t("readyLead"))}</p>
    <form id="rform" class="card"><div class="row">
      <div class="field"><label for="r-adults">${esc(t("adults"))}</label><input id="r-adults" name="adults" type="number" min="1" inputmode="numeric" value="${ad}"></div>
      <div class="field"><label for="r-kids">${esc(t("kids"))}</label><input id="r-kids" name="kids" type="number" min="0" inputmode="numeric" value="${kd}"></div>
      <div class="field"><label for="r-days">${esc(t("days"))}</label><input id="r-days" name="days" type="number" min="1" max="60" inputmode="numeric" value="${days}"></div>
    </div></form><div id="rtable" aria-live="polite"></div>`;
}
function readyTable() {
  const a = store.ans, people = Math.max(1, (+a.adults || 1) + (+a.kids || 0)), days = Math.max(1, +a.days || 28), k = people * days / 10;
  const fmt = (v, u) => (u === "L" ? Math.ceil(v) : v < 10 ? (Math.round(v * 10) / 10).toLocaleString(lang) : Math.round(v)) + " " + u;
  let h = `<div class="card"><h2>${esc(t("foodH"))}</h2><table><tbody>${STOCK.map(s => `<tr><td>${esc(L(s))}</td><td class="n">${fmt(s.per10 * k, s.unit)}</td></tr>`).join("")}</tbody></table>
    <p class="hint">BBK: ${lang === "de" ? "Checkliste 10-Tage-Vorrat, pro Person etwa 2.200 kcal am Tag" : "10-day stock checklist, about 2,200 kcal per person per day"}.</p></div>`;
  h += `<div class="card"><h2>${esc(t("otherH"))}</h2><table><tbody>${otherStock(people, days).map(([n, v]) => `<tr><td>${esc(L(n))}</td><td class="n">${esc(v)}</td></tr>`).join("")}</tbody></table><p class="hint">${esc(t("rule"))}</p></div>`;
  h += `<div class="actions"><button type="button" onclick="window.print()">${esc(t("print"))}</button></div>`;
  return h;
}
const CARD_FIELDS = ["c_meet", "c_times", "c_point", "c_chan", "c_water", "c_people", "c_contacts", "c_valves"];
function viewCard() {
  let h = `<h1>${esc(t("cardTitle"))}</h1><p class="lead noprint">${esc(t("cardLead"))}</p><form id="cform" class="card">`;
  for (const f of CARD_FIELDS) {
    const long = ["c_people", "c_contacts"].includes(f), v = esc(store.card[f] || "");
    h += `<div class="field"><label for="${f}">${esc(t(f))}</label>${long ? `<textarea id="${f}" name="${f}">${v}</textarea>` : `<input id="${f}" name="${f}" type="text" value="${v}">`}</div>`;
  }
  h += `<p class="hint noprint" id="csaved" aria-live="polite"></p></form><div class="actions"><button type="button" onclick="window.print()">${esc(t("print"))}</button><a class="btn" href="#comms">${esc(L(SEC.comms.t))} →</a></div>`;
  return h;
}
function viewAll() {
  let h = `<div class="actions"><button class="primary" type="button" onclick="window.print()">${esc(t("print"))}</button></div>`;
  h += `<p class="print-only"><b>Standby</b> – ${esc(t("tagline"))}</p>`;
  for (const s of SECTIONS) h += sectionHTML(s);
  return h;
}

function render() {
  const r = (location.hash || "#").slice(1);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("f1").textContent = t("f1"); document.getElementById("f2").textContent = t("f2"); document.getElementById("f3").textContent = t("f3");
  let title = "Standby";
  if (r === "check") { app.innerHTML = backBtn() + viewCheck(); title += " · " + t("check"); wireCheck(); }
  else if (r === "ready") { app.innerHTML = backBtn() + viewReady(); title += " · " + t("ready"); wireReady(); }
  else if (r === "card") { app.innerHTML = backBtn() + viewCard(); title += " · " + t("card"); wireCard(); }
  else if (r === "all") { app.innerHTML = backBtn() + viewAll(); title += " · " + t("all"); }
  else if (SEC[r]) { app.innerHTML = backBtn() + sectionHTML(SEC[r]) + backBtn(); title += " · " + L(SEC[r].t); }
  else { app.innerHTML = viewHome(); title += (lang === "de" ? " – 4 Wochen ohne Strom" : " – 4 weeks without power"); }
  document.title = title;
}
function wireCheck() {
  const f = document.getElementById("qform"), res = document.getElementById("result");
  const upd = e => { if (e.target.name) { store.ans[e.target.name] = e.target.value; save(); if (res.dataset.shown) res.innerHTML = resultHTML(); } };
  f.addEventListener("change", upd); f.addEventListener("input", e => { if (e.target.type === "number") upd(e); });
  f.addEventListener("submit", e => { e.preventDefault(); res.dataset.shown = "1"; res.innerHTML = resultHTML(); res.scrollIntoView({ block: "start" }); res.querySelector("h2").setAttribute("tabindex", "-1"); res.querySelector("h2").focus({ preventScroll: true }); });
  if (store.shown) { res.dataset.shown = "1"; res.innerHTML = resultHTML(); }
  f.addEventListener("submit", () => { store.shown = true; save(); });
}
function wireReady() {
  const f = document.getElementById("rform"), out = document.getElementById("rtable");
  const upd = () => { for (const n of ["adults", "kids", "days"]) store.ans[n] = f.elements[n].value; save(); out.innerHTML = readyTable(); };
  f.addEventListener("input", upd); f.addEventListener("submit", e => e.preventDefault()); out.innerHTML = readyTable();
}
function wireCard() {
  const f = document.getElementById("cform"), s = document.getElementById("csaved");
  f.addEventListener("input", e => { store.card[e.target.name] = e.target.value; save(); s.textContent = t("saved"); });
  f.addEventListener("submit", e => e.preventDefault());
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.lang = lang; save(); render(); });
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
