<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2a2b">
<title>Cyber Quest – safe when AI attacks</title>
<style>
:root{
  --bg:#f6f7f4;--card:#ffffff;--ink:#1d2421;--mute:#56605b;--line:#d8ddd9;
  --acc:#1f6f5c;--acc-ink:#ffffff;
  --r:#b3261e;--r-bg:#fbe9e7;--a:#8a5a00;--a-bg:#fdf1d8;--g:#1e6b34;--g-bg:#e3f3e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614;--card:#1b211e;--ink:#e8ece9;--mute:#a7b0ab;--line:#2f3833;
  --acc:#6fd0b3;--acc-ink:#0d1a16;
  --r:#ffb4ab;--r-bg:#3a1a17;--a:#f4c36a;--a-bg:#3a2c10;--g:#8fd8a1;--g-bg:#16301d;
}}
*{box-sizing:border-box}
html{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;line-height:1.5}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.wrap{max-width:44rem;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
h1{font-size:1.45rem;margin:.3rem 0}
h2{font-size:1.2rem;margin:1.4rem 0 .5rem}
h3{font-size:1.05rem;margin:0}
.card>h2:first-child{margin-top:0}
p{margin:.4rem 0}
.mute{color:var(--mute)}
.lang{display:flex;gap:.3rem}
.lang button,.btn{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:.6rem;padding:.4rem .8rem;font:inherit;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600;width:100%;margin-top:1rem}
.btn.sos{background:var(--r-bg);color:var(--r);border-color:var(--r);font-weight:600}
.btn:focus-visible,.lang button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:1rem;margin:.8rem 0}
fieldset{border:0;margin:0 0 1.1rem;padding:0}
legend{font-weight:600;padding:0;margin-bottom:.3rem}
.hint{font-size:.9rem;color:var(--mute);margin:0 0 .3rem}
label.opt{display:flex;align-items:center;gap:.6rem;min-height:44px;padding:.35rem .6rem;border:1px solid var(--line);border-radius:.6rem;margin:.3rem 0;cursor:pointer}
label.opt input{width:1.3rem;height:1.3rem;flex:none}
label.opt:has(input:checked){border-color:var(--acc);outline:1px solid var(--acc)}
.sec-title{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700;margin:1.2rem 0 .5rem}
.bar{height:.8rem;background:var(--line);border-radius:1rem;overflow:hidden;margin:.4rem 0}
.bar span{display:block;height:100%;background:var(--acc)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.chip{border-radius:1rem;padding:.15rem .7rem;font-size:.9rem;font-weight:600}
.chip.r{background:var(--r-bg);color:var(--r)}.chip.a{background:var(--a-bg);color:var(--a)}.chip.g{background:var(--g-bg);color:var(--g)}
details.act{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:.8rem;margin:.6rem 0}
details.act.r{border-left-color:var(--r)}details.act.a{border-left-color:var(--a)}details.act.g{border-left-color:var(--g)}
details.act.done{opacity:.7}
details.act summary{list-style:none;cursor:pointer;padding:.8rem 1rem;min-height:44px}
details.act summary::-webkit-details-marker{display:none}
details.act summary .tag{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
details.act.r .tag{color:var(--r)}details.act.a .tag{color:var(--a)}details.act.g .tag{color:var(--g)}
details.act.done h3{text-decoration:line-through}
.body{padding:0 1rem 1rem}
.body ol{padding-left:1.3rem;margin:.4rem 0}
.body li{margin:.35rem 0}
.why{font-style:italic;color:var(--mute)}
label.done{display:flex;align-items:center;gap:.6rem;min-height:44px;font-weight:600;margin-top:.5rem;cursor:pointer}
label.done input{width:1.4rem;height:1.4rem}
code{background:var(--bg);border:1px solid var(--line);border-radius:.3rem;padding:0 .25rem;font-size:.92em}
a{color:var(--acc)}
.sos-card{border-color:var(--r)}
.sos-card ol li{margin:.4rem 0}
footer{font-size:.85rem;color:var(--mute);margin:2rem 0 1rem}
[hidden]{display:none!important}
@media print{.noprint,header .lang{display:none!important}details.act{break-inside:avoid}details.act .body{display:block}body{background:#fff;color:#000}}
.hq{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.hq svg{width:9.5rem;height:auto;flex:none}
.hq .stats{flex:1;min-width:12rem}
.botname{font:inherit;font-weight:700;font-size:1.15rem;border:1px dashed var(--line);border-radius:.5rem;padding:.3rem .5rem;background:transparent;color:var(--ink);width:100%;min-height:44px}
.rank{font-weight:700;color:var(--acc)}
.part{transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.part{transition:none}}
.mallory{border-left:4px solid #2f8a63;background:color-mix(in srgb,#2f8a63 9%,var(--card));padding:.6rem .8rem;border-radius:.5rem;margin:.5rem 0;font-style:italic}
.said{margin:.3rem 0;font-weight:400;color:var(--ink)}
.mallory b{font-style:normal;color:#2f8a63}
@media (prefers-color-scheme:dark){.mallory{border-left-color:#7fd6ad}.said{margin:.3rem 0;font-weight:400;color:var(--ink)}
.mallory b{color:#7fd6ad}}
.steps li.now{font-weight:600}
.steps li.ok{color:var(--mute);text-decoration:line-through}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.row .btn{flex:1 1 auto}
.btn.ok{background:var(--g-bg);color:var(--g);border-color:var(--g);font-weight:600}
.note{background:var(--a-bg);color:var(--ink);border-radius:.5rem;padding:.6rem .8rem;margin:.5rem 0}
.foiled{background:var(--g-bg);color:var(--g);border-radius:.5rem;padding:.6rem .8rem;margin:.5rem 0;font-weight:600}
textarea{width:100%;min-height:9rem;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:.5rem;padding:.5rem;background:var(--bg);color:var(--ink)}
input[type=text],input[type=password]{width:100%;min-height:44px;font:inherit;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .6rem;background:var(--bg);color:var(--ink)}
.msg{border:1px solid var(--line);border-radius:1rem;padding:.7rem .9rem;margin:.5rem 0;background:var(--bg)}
.msg .from{font-size:.85rem;color:var(--mute);font-weight:600}
.links a{display:inline-block;margin:.2rem .6rem .2rem 0;min-height:44px;line-height:44px}
.chat .me{background:var(--bg);border-radius:.6rem;padding:.5rem .7rem;margin:.4rem 0 .4rem 2rem;white-space:pre-wrap}
.chat .ai{background:var(--g-bg);border-radius:.6rem;padding:.5rem .7rem;margin:.4rem 2rem .4rem 0;white-space:pre-wrap}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:.4rem 0;z-index:2}
.tabs .btn{flex:1 1 0;padding:.3rem .4rem;font-size:.85rem}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{margin:-1rem -1rem .5rem;overflow:hidden}
.hero video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#1b2a2b}
@media(min-width:44rem){.hero{margin:0 0 .5rem;border-radius:1rem}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.6rem 0}
.duo figure{margin:0;text-align:center}
.duo img{height:13rem;width:auto;max-width:100%;object-fit:contain}
.duo figcaption b{display:block;font-size:1.05rem}
.duo .ph b{color:#a87a00}.duo .yi b{color:#2f8a63}
@media (prefers-color-scheme:dark){.duo .ph b{color:#f2c94c}.duo .yi b{color:#7fd6ad}}
.who{display:flex;gap:.6rem;align-items:flex-start}
.ava{width:2.6rem;height:2.6rem;border-radius:50%;object-fit:cover;background:#fdf6e3;flex:none;border:2px solid currentColor}
.ava.big{width:3.4rem;height:3.4rem}
.anim{display:block;width:100%;max-width:22rem;aspect-ratio:16/9;border-radius:.6rem;margin:.5rem 0;object-fit:cover;background:#1b2a2b}
details.act summary{display:flex;gap:.7rem;align-items:center}
.qicon{width:2.6rem;height:2.6rem;flex:none}
.tabs img{width:1.3rem;height:1.3rem;vertical-align:-.25rem}
.introvid{width:100%;border-radius:.8rem;margin-top:.5rem;background:#1b2a2b}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><video id="heroVid" src="assets/poster.mp4" poster="assets/poster.webp" muted loop playsinline autoplay aria-hidden="true"></video></div>
<header>
  <h1 id="title"></h1>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="de">DE</button>
  </div>
</header>
<p id="tagline" class="mute"></p>
<button type="button" class="btn sos noprint" id="sosBtn" aria-expanded="false" aria-controls="sos"></button>
<section id="sos" class="card sos-card" hidden></section>

<section class="card" id="intro"></section>

<form id="form" class="noprint" novalidate></form>
<section id="plan" aria-live="polite"></section>

<footer><p id="foot"></p><p><a href="https://github.com/michaelwartmann/michaelwartmann.github.io/tree/main/cyber">GitHub</a> · <a href="../">向日葵.世界</a></p></footer>
</div>

<script>
"use strict";
/* ---------- storage (local only) ---------- */
const KEY = "cybercheck-v1";
let st = { lang: null, ans: {}, done: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
if (!st.lang) st.lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
const t = o => (o && (o[st.lang] ?? o.en)) || "";
const L = (en, de) => ({ en, de });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- texts ---------- */
const T = {
  title: L("Cyber check", "Cyber-Check"),
  tagline: L("Safe in cyberspace, now that AI can attack. About 20 questions, then your personal plan. Your answers stay on this phone.",
             "Sicher im Netz, jetzt wo KI angreifen kann. Etwa 20 Fragen, dann dein persönlicher Plan. Deine Antworten bleiben auf diesem Gerät."),
  sos: L("🆘 I think I've been hacked", "🆘 Ich glaube, ich wurde gehackt"),
  introH: L("Why now", "Warum jetzt"),
  intro: [
    L("AI agents can now scan for weak devices, try leaked passwords everywhere, write flawless phishing in your language and clone a voice from a short clip — automatically, cheaply, at scale.",
      "KI-Agenten suchen heute automatisch nach schwachen Geräten, probieren geleakte Passwörter überall aus, schreiben fehlerfreie Phishing-Mails in deiner Sprache und klonen eine Stimme aus einem kurzen Clip – billig und massenhaft."),
    L("The defence is mostly the old basics, done properly: updates, unique passwords, passkeys, backups, a router that's been looked at, and a family code word. The difference: now you can't skip them.",
      "Die Abwehr sind meist die alten Grundlagen, aber richtig gemacht: Updates, einzigartige Passwörter, Passkeys, Backups, ein durchgesehener Router und ein Familien-Codewort. Der Unterschied: Man kann sie nicht mehr auslassen.")
  ],
  go: L("Show my plan", "Meinen Plan zeigen"),
  planH: L("Your plan", "Dein Plan"),
  R: L("Today", "Heute"), A: L("This week", "Diese Woche"), G: L("Good", "Gut"),
  okH: L("Already good", "Schon gut"),
  progress: L("done", "erledigt"),
  markDone: L("Done", "Erledigt"),
  print: L("Print plan", "Plan drucken"),
  reset: L("Start over", "Neu anfangen"),
  resetQ: L("Tap again: delete all answers and ticks", "Nochmal tippen: alle Antworten und Häkchen löschen"),
  edit: L("Change answers", "Antworten ändern"),
  missing: L("Unanswered questions count as “don't know”.", "Unbeantwortete Fragen zählen als „weiß nicht“."),
  foot: L("Draft, Nov 2026. Based on BSI, Verbraucherzentrale, NCSC (UK) and FBI/FTC advice. No accounts, no tracking, nothing leaves your phone. MIT licence.",
          "Entwurf, Nov. 2026. Grundlage: Empfehlungen von BSI, Verbraucherzentrale, NCSC (UK) und FBI/FTC. Keine Konten, kein Tracking, nichts verlässt dein Gerät. MIT-Lizenz.")
};

const SOS = {
  h: L("If you think you've been hacked", "Wenn du glaubst, gehackt worden zu sein"),
  steps: [
    L("Breathe. Act in order, not in panic. Don't pay anyone and don't call numbers from the suspicious message.",
      "Durchatmen. Der Reihe nach handeln, nicht in Panik. Niemandem Geld zahlen, keine Nummern aus der verdächtigen Nachricht anrufen."),
    L("Money at risk? Call your bank now using the number on your card. In Germany you can block cards and online banking via 116 116.",
      "Geht es um Geld? Sofort die Bank anrufen – Nummer von der Karte nehmen. In Deutschland sperrt der Sperr-Notruf 116 116 Karten und Onlinebanking."),
    L("Device acting strange or you installed something on request? Switch it to flight mode / unplug the network. Don't use it for logins.",
      "Gerät verhält sich seltsam oder du hast auf Aufforderung etwas installiert? Flugmodus / Netzwerk trennen. Nicht mehr zum Einloggen benutzen."),
    L("From a different, clean device: change your email password first (email resets everything else), then sign out all other sessions and check the recovery phone/email haven't been changed.",
      "Von einem anderen, sauberen Gerät: zuerst das E-Mail-Passwort ändern (über die E-Mail lässt sich alles andere zurücksetzen), dann alle anderen Sitzungen abmelden und prüfen, ob Wiederherstellungs-Nummer/-Adresse geändert wurden."),
    L("Then the same for bank, Apple/Google/Microsoft account, phone carrier, social media, shopping — and every place where you used the same password.",
      "Dann dasselbe für Bank, Apple/Google/Microsoft-Konto, Mobilfunkanbieter, soziale Netzwerke, Shopping – und überall, wo dasselbe Passwort benutzt wurde."),
    L("Take screenshots, note times. Report it: in Germany to the police online watch (Onlinewache of your state); elsewhere your national police/fraud reporting.",
      "Screenshots machen, Uhrzeiten notieren. Anzeige erstatten: in Deutschland über die Onlinewache der Polizei deines Bundeslandes."),
    L("Warn your contacts if your account sent messages. Then, calmly, come back here and do the plan.",
      "Kontakte warnen, falls dein Konto Nachrichten verschickt hat. Danach in Ruhe hierher zurück und den Plan durchgehen.")
  ]
};

/* ---------- sections & questions ---------- */
const SEC = {
  dev: L("Devices", "Geräte"),
  acc: L("Accounts & passwords", "Konten & Passwörter"),
  home: L("Home network", "Heimnetz"),
  data: L("Your data", "Deine Daten"),
  ppl: L("People & scams", "Menschen & Betrug")
};
const DK = L("Don't know", "Weiß nicht");
const Q = [
  { id: "phone", sec: "dev", q: L("Which phone do you use?", "Welches Handy nutzt du?"),
    opts: [["ios", L("iPhone", "iPhone")], ["android", L("Android (Samsung, Pixel, Xiaomi …)", "Android (Samsung, Pixel, Xiaomi …)")], ["none", L("No smartphone", "Kein Smartphone")]] },
  { id: "phoneUpd", sec: "dev", show: a => a.phone && a.phone !== "none",
    q: L("Does your phone install updates automatically and is it still supported?", "Installiert dein Handy Updates automatisch und bekommt es noch welche?"),
    hint: L("Phones older than about 5–7 years often get no security updates any more.", "Handys älter als etwa 5–7 Jahre bekommen oft keine Sicherheitsupdates mehr."),
    opts: [["ok", L("Yes, automatic and current", "Ja, automatisch und aktuell")], ["dk", L("Not sure", "Nicht sicher")], ["old", L("It's old / no more updates", "Es ist alt / keine Updates mehr")]] },
  { id: "lock", sec: "dev", show: a => a.phone && a.phone !== "none",
    q: L("How is your phone locked?", "Wie ist dein Handy gesperrt?"),
    opts: [["strong", L("6+ digit PIN or password (with fingerprint/face)", "PIN mit 6+ Ziffern oder Passwort (mit Finger/Gesicht)")], ["weak", L("4-digit PIN, pattern, or nothing", "4-stellige PIN, Muster oder gar nicht")]] },
  { id: "apps", sec: "dev", show: a => a.phone && a.phone !== "none",
    q: L("Where do your apps come from?", "Woher stammen deine Apps?"),
    opts: [["store", L("Only the official store", "Nur aus dem offiziellen Store")], ["other", L("Also from websites / other stores", "Auch von Webseiten / anderen Stores")], ["dk", DK]] },
  { id: "pc", sec: "dev", q: L("Which computer do you use?", "Welchen Computer nutzt du?"),
    opts: [["win11", L("Windows 11", "Windows 11")], ["win10", L("Windows 10", "Windows 10")], ["mac", L("Mac", "Mac")], ["linux", L("Linux", "Linux")], ["chrome", L("Chromebook", "Chromebook")], ["none", L("No computer", "Kein Computer")]] },
  { id: "pcUpd", sec: "dev", show: a => a.pc && a.pc !== "none",
    q: L("Does the computer install updates automatically?", "Installiert der Computer Updates automatisch?"),
    opts: [["ok", L("Yes", "Ja")], ["no", L("Manually / not sure", "Manuell / nicht sicher")]] },
  { id: "enc", sec: "dev", show: a => a.pc && a.pc !== "none" && a.pc !== "chrome",
    q: L("Is the computer's disk encrypted?", "Ist die Festplatte des Computers verschlüsselt?"),
    hint: L("BitLocker / Device encryption (Windows), FileVault (Mac), LUKS (Linux).", "BitLocker / Geräteverschlüsselung (Windows), FileVault (Mac), LUKS (Linux)."),
    opts: [["yes", L("Yes", "Ja")], ["no", L("No", "Nein")], ["dk", DK]] },

  { id: "pm", sec: "acc", q: L("How do you keep your passwords?", "Wie verwaltest du deine Passwörter?"),
    opts: [["pm", L("Password manager, for everything", "Passwort-Manager, für alles")], ["browser", L("The browser saves them", "Der Browser speichert sie")], ["mix", L("Partly manager, partly elsewhere", "Teils Manager, teils woanders")], ["none", L("Memory, paper, or similar", "Im Kopf, auf Papier o. Ä.")]] },
  { id: "reuse", sec: "acc", q: L("Do you use the same password on several sites?", "Nutzt du dasselbe Passwort auf mehreren Seiten?"),
    opts: [["never", L("Never", "Nie")], ["some", L("On some less important ones", "Bei einigen unwichtigeren")], ["often", L("Often", "Oft")]] },
  { id: "mail2fa", sec: "acc", q: L("How is your main email account protected?", "Wie ist dein Haupt-E-Mail-Konto geschützt?"),
    hint: L("Your email can reset every other password. It's the master key.", "Über die E-Mail lässt sich jedes andere Passwort zurücksetzen. Sie ist der Generalschlüssel."),
    opts: [["strong", L("Passkey, or authenticator app / security key", "Passkey oder Authenticator-App / Sicherheitsschlüssel")], ["sms", L("Code by SMS", "Code per SMS")], ["none", L("Only a password / don't know", "Nur Passwort / weiß nicht")]] },
  { id: "other2fa", sec: "acc", q: L("Bank, Apple/Google/Microsoft, social media, shopping: second factor or passkey on?", "Bank, Apple/Google/Microsoft, soziale Netzwerke, Shopping: zweiter Faktor oder Passkey an?"),
    opts: [["all", L("On all important ones", "Bei allen wichtigen")], ["some", L("On some", "Bei manchen")], ["none", L("None / don't know", "Keinem / weiß nicht")]] },
  { id: "leaks", sec: "acc", q: L("Have you checked whether your email address is in data leaks?", "Hast du geprüft, ob deine E-Mail-Adresse in Datenlecks auftaucht?"),
    opts: [["fixed", L("Yes, and I changed the affected passwords", "Ja, und betroffene Passwörter geändert")], ["open", L("Yes, but not everything fixed", "Ja, aber noch nicht alles behoben")], ["never", L("Never checked", "Nie geprüft")]] },
  { id: "recovery", sec: "acc", q: L("Do you have recovery codes for your main accounts stored offline (paper, safe place)?", "Hast du Wiederherstellungscodes deiner Hauptkonten offline (Papier, sicherer Ort)?"),
    opts: [["yes", L("Yes", "Ja")], ["no", L("No / don't know", "Nein / weiß nicht")]] },

  { id: "router", sec: "home", q: L("Your internet router (e.g. FRITZ!Box, Speedport, provider box):", "Dein Internet-Router (z. B. FRITZ!Box, Speedport, Box vom Anbieter):"),
    opts: [["ok", L("Own admin password, automatic updates on", "Eigenes Admin-Passwort, automatische Updates an")], ["dk", L("Not sure", "Nicht sicher")], ["never", L("Never looked at it", "Nie angeschaut")]] },
  { id: "wifi", sec: "home", q: L("Your Wi-Fi password:", "Dein WLAN-Passwort:"),
    opts: [["strong", L("Long and random (own or from the sticker)", "Lang und zufällig (eigenes oder vom Aufkleber)")], ["weak", L("Short, guessable, or shared with many", "Kurz, erratbar oder an viele weitergegeben")], ["dk", DK]] },
  { id: "iot", sec: "home", q: L("Smart devices (cameras, smart TV, plugs, doorbell, robot vacuum …)?", "Smarte Geräte (Kameras, Smart-TV, Steckdosen, Klingel, Saugroboter …)?"),
    opts: [["none", L("None", "Keine")], ["ok", L("Yes, updated and on a guest network", "Ja, aktuell und im Gastnetz")], ["never", L("Yes, never looked at them", "Ja, nie angeschaut")]] },

  { id: "backup", sec: "data", q: L("Backups of photos and important files:", "Backups von Fotos und wichtigen Dateien:"),
    hint: L("Ransomware also encrypts what is synced. An unplugged copy survives.", "Erpressersoftware verschlüsselt auch Synchronisiertes. Eine abgesteckte Kopie überlebt."),
    opts: [["good", L("Automatic, plus a copy that is offline/elsewhere", "Automatisch, plus eine Kopie offline/woanders")], ["cloud", L("Only cloud sync (iCloud, Google, OneDrive …)", "Nur Cloud-Sync (iCloud, Google, OneDrive …)")], ["manual", L("Sometimes, by hand", "Ab und zu, von Hand")], ["none", L("None", "Keine")]] },

  { id: "code", sec: "ppl", q: L("Does your family have a code word for emergency calls?", "Hat deine Familie ein Codewort für Notfall-Anrufe?"),

/* ---------- actions ---------- */
function plan(a) {
  const out = [];
  const add = (id, p, sec, title, why, steps) => out.push({ id, p, sec, title, why, steps });
  const ph = a.phone, pc = a.pc;

  /* phone updates */
  if (ph && ph !== "none") {
    const updSteps = ph === "ios"
      ? [L("Settings → General → Software Update → Automatic Updates: turn everything on, including “Security Responses”.", "Einstellungen → Allgemein → Softwareupdate → Automatische Updates: alles einschalten, auch „Sicherheitsmaßnahmen“."),
         L("Install any update that is waiting now.", "Wartendes Update jetzt installieren."),
         L("Settings → App Store → App Updates: on.", "Einstellungen → App Store → App-Updates: ein.")]
      : [L("Settings → search “Software update” → install what's waiting; turn on automatic download.", "Einstellungen → nach „Software-Update“ suchen → Wartendes installieren; automatischen Download einschalten."),
         L("Settings → Security & privacy → Updates: also install the “Google Play system update”.", "Einstellungen → Sicherheit & Datenschutz → Updates: auch das „Google Play-Systemupdate“ installieren."),
         L("Play Store → profile → Settings → Network preferences → Auto-update apps: on.", "Play Store → Profil → Einstellungen → Netzwerkeinstellungen → Apps automatisch aktualisieren: ein."),

    if (a.phoneUpd === "old")
      add("phoneOld", "r", "dev", L("Your phone no longer gets security fixes", "Dein Handy bekommt keine Sicherheitsupdates mehr"),
        L("AI tools turn published flaws into working attacks within days. An unpatched phone stays open forever.", "KI-Werkzeuge machen aus veröffentlichten Lücken binnen Tagen fertige Angriffe. Ein ungepatchtes Handy bleibt für immer offen."),
        [L("Plan a replacement. A used or refurbished model with several years of guaranteed updates is fine.", "Ersatz planen. Ein gebrauchtes oder generalüberholtes Modell mit noch mehreren Jahren Update-Garantie reicht."),
         L("Until then: no banking, no password manager, no work email on this phone.", "Bis dahin: kein Banking, kein Passwort-Manager, keine Arbeits-Mails auf diesem Handy."),
         L("When you switch: reset the old phone to factory settings before giving it away.", "Beim Wechsel: altes Handy auf Werkseinstellungen zurücksetzen, bevor du es weitergibst.")]);
    else
      add("phoneUpd", a.phoneUpd === "ok" ? "g" : "r", "dev", L("Automatic updates on the phone", "Automatische Updates auf dem Handy"),
        L("Most real attacks use holes that are already fixed. Updates close them.", "Die meisten echten Angriffe nutzen Lücken, die längst geschlossen sind. Updates schließen sie."), updSteps);

    add("theft", "a", "dev", L("Theft protection and Find my phone", "Diebstahlschutz und Handy-Ortung"),

           L("Settings → search “Find My Device” → on.", "Einstellungen → nach „Mein Gerät finden“ suchen → ein.")]);

       L("Hide message contents on the lock screen.", "Nachrichteninhalte auf dem Sperrbildschirm ausblenden.")]);

    add("apps", a.apps === "store" ? "g" : "a", "dev", L("Clean up apps and permissions", "Apps und Berechtigungen aufräumen"),

         : L("Only install from the App Store. Never install a “profile” or app because a message or caller asks you to.", "Nur aus dem App Store installieren. Nie ein „Profil“ oder eine App installieren, weil eine Nachricht oder ein Anrufer das will."),
       L("Never install remote-control apps (AnyDesk, TeamViewer …) for a caller. Real support doesn't call you.", "Nie Fernwartungs-Apps (AnyDesk, TeamViewer …) für einen Anrufer installieren. Echter Support ruft nicht an.")]);
  }

  /* computer */
  if (pc && pc !== "none") {
    const S = {
      win11: [L("Settings → Windows Update: install everything; turn on “Get the latest updates as soon as they're available”.", "Einstellungen → Windows Update: alles installieren; „Die neuesten Updates erhalten, sobald sie verfügbar sind“ einschalten."),
              L("Windows Security → Firewall & network protection: all three networks “on”. Virus & threat protection: on.", "Windows-Sicherheit → Firewall- & Netzwerkschutz: alle drei Netzwerke „ein“. Viren- & Bedrohungsschutz: ein."),
              L("Windows Security → App & browser control → Reputation-based protection: on.", "Windows-Sicherheit → App- & Browsersteuerung → Zuverlässigkeitsbasierter Schutz: ein.")],

              L("Check your release is still supported (e.g. Ubuntu LTS).", "Prüfen, ob deine Version noch unterstützt wird (z. B. Ubuntu LTS).")],
      chrome:[L("Updates are automatic: restart when it asks.", "Updates kommen automatisch: neu starten, wenn er fragt."),
              L("Settings → About ChromeOS → Additional details → Update schedule: check the end date.", "Einstellungen → Über ChromeOS → Weitere Details → Update-Zeitplan: Enddatum prüfen.")]
    }[pc];
    const pr = pc === "win10" ? "r" : (a.pcUpd === "ok" ? "g" : "r");
    add("pcUpd", pr, "dev", pc === "win10" ? L("Windows 10: get the extra security updates, plan the move", "Windows 10: Zusatz-Sicherheitsupdates holen, Wechsel planen") : L("Updates and firewall on the computer", "Updates und Firewall auf dem Computer"),

      add("enc", a.enc === "yes" ? "g" : "a", "dev", L("Encrypt the computer's disk", "Festplatte des Computers verschlüsseln"),

                  L("Save the recovery key (it's in your Microsoft account; also print it and keep it safe).", "Wiederherstellungsschlüssel sichern (liegt im Microsoft-Konto; zusätzlich ausdrucken und sicher aufbewahren).")],

          linux: [L("Full-disk encryption (LUKS) is chosen at installation. If you don't have it: encrypt at the next reinstall, and encrypt your backup drives now.", "Vollverschlüsselung (LUKS) wählt man bei der Installation. Falls nicht vorhanden: bei der nächsten Neuinstallation aktivieren, Backup-Platten schon jetzt verschlüsseln."),

  add("reuse", a.reuse === "never" ? "g" : a.reuse === "often" ? "r" : "a", "acc", L("No password twice", "Kein Passwort doppelt"),

  add("mail", a.mail2fa === "strong" ? "g" : a.mail2fa === "sms" ? "a" : "r", "acc", L("Lock the master key: your email", "Den Generalschlüssel sichern: deine E-Mail"),
    L("Passkeys can't be phished. The UK's NCSC now recommends them wherever offered.", "Passkeys lassen sich nicht abphishen. Das britische NCSC empfiehlt sie inzwischen überall, wo angeboten."),
    [L("Log in to your email provider's security settings (Gmail: myaccount.google.com → Security; Outlook: account.microsoft.com → Security; GMX/Web.de/Proton: Settings → Security).", "In die Sicherheitseinstellungen des Anbieters gehen (Gmail: myaccount.google.com → Sicherheit; Outlook: account.microsoft.com → Sicherheit; GMX/Web.de/Proton: Einstellungen → Sicherheit)."),
     L("Add a passkey. If not offered: an authenticator app (e.g. Aegis, 2FAS, Google/Microsoft Authenticator) instead of SMS.", "Passkey hinzufügen. Falls nicht angeboten: Authenticator-App (z. B. Aegis, 2FAS, Google/Microsoft Authenticator) statt SMS."),
     L("Check the recovery phone and recovery email are yours and current.", "Prüfen, dass Wiederherstellungs-Nummer und -Adresse deine sind und stimmen."),
     L("Review “devices / recent activity” and sign out anything you don't recognise.", "„Geräte / letzte Aktivität“ ansehen und Unbekanntes abmelden.")]);
  add("2fa", a.other2fa === "all" ? "g" : a.other2fa === "none" ? "r" : "a", "acc", L("Passkey or second factor on every important account", "Passkey oder zweiter Faktor bei jedem wichtigen Konto"),
    L("Even a stolen password is then useless on its own.", "Dann ist selbst ein gestohlenes Passwort allein nutzlos."),
    [L("In each account: Settings → Security → look for “Passkey”, “2-step verification” or “Two-factor”.", "In jedem Konto: Einstellungen → Sicherheit → nach „Passkey“, „Bestätigung in zwei Schritten“ oder „Zwei-Faktor“ suchen."),

     L("WhatsApp: Settings → Account → Two-step verification → set a PIN.", "WhatsApp: Einstellungen → Account → Verifizierung in zwei Schritten → PIN setzen."),
     L("Never tell anyone a code you receive. No bank, no police, no support ever asks for it.", "Einen empfangenen Code nie weitergeben. Keine Bank, keine Polizei, kein Support fragt je danach.")]);
  add("leaks", a.leaks === "fixed" ? "g" : a.leaks === "open" ? "r" : "a", "acc", L("Check data leaks", "Datenlecks prüfen"),

    [L("Enter each of your email addresses at haveibeenpwned.com (or the HPI Identity Leak Checker, sec.hpi.de/ilc).", "Jede deiner E-Mail-Adressen bei haveibeenpwned.com eingeben (oder beim HPI Identity Leak Checker, sec.hpi.de/ilc)."),
     L("For each leaked service: change that password, and everywhere you used the same one.", "Für jeden betroffenen Dienst: Passwort ändern – und überall, wo dasselbe benutzt wurde."),

  add("recovery", a.recovery === "yes" ? "g" : "a", "acc", L("Recovery codes on paper", "Wiederherstellungscodes auf Papier"),

    add("iot", a.iot === "ok" ? "g" : "a", "home", L("Smart devices into the guest network", "Smarte Geräte ins Gastnetz"),

const strip = s => String(s).replace(/<[^>]+>/g, "");
const xpFor = p => p === "r" ? 30 : 20;
function state() {
  const list = plan(st.ans);
  const todo = list.filter(x => x.p !== "g"), ok = list.filter(x => x.p === "g");
  let xp = ok.length * 10 + todo.filter(x => st.done[x.id]).reduce((s, x) => s + xpFor(x.p), 0);
  xp += TRICKS.filter(q => st.quiz[q.id] && st.quiz[q.id].right).length * 10;
  const foiled = todo.filter(x => st.done[x.id]).length;
  const parts = {};
  for (const p in PARTS) {
    const mine = list.filter(x => PARTS[p].ids.includes(x.id));
    parts[p] = mine.length ? mine.filter(x => x.p === "g" || st.done[x.id]).length / mine.length : 1;
  }
  let rank = RANKS[0][1]; for (const [n, r] of RANKS) if (xp >= n) rank = r;
  const next = (RANKS.find(([n]) => n > xp) || [null])[0];
  return { list, todo, ok, xp, foiled, parts, rank, next };
}

      <label for="orModel">${esc(t(T.modelL))}</label><input id="orModel" type="text" value="${esc(st.model)}">
      <div class="row"><button class="btn" type="button" id="forgetKey">${esc(t(T.forget))}</button></div>
      <div class="chat" id="chatLog" aria-live="polite">${chat.map(m => `<div class="${m.role === "user" ? "me" : "ai"}">${esc(m.content)}</div>`).join("")}</div>
      <label for="chatIn" class="sr">${esc(t(T.askPh))}</label><textarea id="chatIn" style="min-height:4rem" placeholder="${esc(t(T.askPh))}"></textarea>
      <div class="row"><button class="btn primary" type="button" id="chatSend">${esc(t(T.ask))}</button></div></section>`;
  }
  h += `<div class="noprint" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">
      <button class="btn" type="button" id="editBtn">${esc(t(T.edit))}</button>
      <button class="btn" type="button" id="resetBtn">${esc(t(T.reset))}</button></div>`;
  planEl.innerHTML = h;
  if (scroll) { const hh = $("planH"); planEl.scrollIntoView({ block: "start" }); hh.focus({ preventScroll: true }); }
}

function keepOpen(fn, focusSel) {
  const open = [...planEl.querySelectorAll("details[open]")].map(d => d.dataset.id);
  fn();
  renderGame(false);
  open.forEach(id => { const d = planEl.querySelector(`details[data-id="${id}"]`); if (d) d.open = true; });
  if (focusSel) { const el = planEl.querySelector(focusSel); if (el) el.focus(); }
}
function finish(id) { st.done[id] = true; flash = { [id]: "foiled" }; save(); }

async function sendChat() {
  const inp = $("chatIn"), txt = inp.value.trim(); if (!txt) return;
  st.key = $("orKey").value.trim(); st.model = $("orModel").value.trim() || "openrouter/auto"; save();
  const logEl = $("chatLog");
  if (!st.key) { logEl.insertAdjacentHTML("beforeend", `<div class="note">${esc(t(T.noKey))}</div>`); return; }
  chat.push({ role: "user", content: txt }); inp.value = "";
  logEl.insertAdjacentHTML("beforeend", `<div class="me">${esc(txt)}</div><div class="ai" id="pending">…</div>`);
  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST", headers: { "Authorization": "Bearer " + st.key, "Content-Type": "application/json", "X-Title": "Cyber Quest" },
      body: JSON.stringify({ model: st.model, messages: [{ role: "system", content: aiBriefing() }, ...chat.slice(-20)] })
    });
    const j = await r.json();
    const ans = j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : (j.error && j.error.message) || "?";
    if (j.choices) chat.push({ role: "assistant", content: ans });
    $("pending").outerHTML = `<div class="ai">${esc(ans)}</div>`;
  } catch (e) {
    chat.pop(); $("pending").outerHTML = `<div class="note">${esc(t(T.chatErr))}</div>`;
  }
}

/* ---------- events ---------- */
form.addEventListener("change", e => {
  if (e.target.type !== "radio") return;
  st.ans[e.target.name] = e.target.value; save();
  const y = window.scrollY;
  renderForm(); window.scrollTo(0, y);
  const el = form.querySelector(`input[name="${e.target.name}"][value="${e.target.value}"]`); if (el) el.focus({ preventScroll: true });
  if (st.shown) renderGame(false);
});
form.addEventListener("submit", e => { e.preventDefault(); st.tab = "quests"; renderGame(); });
planEl.addEventListener("click", e => {
  const b = e.target.closest("button,a"); if (!b) return;
  const d = b.dataset;
  if (d.tab) { st.tab = d.tab; flash = {}; save(); renderGame(false); planEl.querySelector(`[data-tab="${d.tab}"]`).focus(); return; }
  if (d.next) {
    const x = state().list.find(q => q.id === d.next);
    keepOpen(() => { st.steps[x.id] = (st.steps[x.id] || 0) + 1; flash = {}; if (st.steps[x.id] >= x.steps.length) finish(x.id); save(); },
      st.done[x.id] ? `details[data-id="${x.id}"] summary` : `[data-next="${x.id}"]`);
    return;
  }
  if (d.fail) { keepOpen(() => { flash = { [d.fail]: "fail" }; }, `[data-fail="${d.fail}"]`); return; }
  if (d.stuck) { keepOpen(() => { flash = { [d.stuck]: "stuck" }; }, `#sp-${d.stuck}`); return; }
  if (d.undo) { keepOpen(() => { delete st.done[d.undo]; st.steps[d.undo] = 0; flash = {}; save(); }); return; }
  if (d.q) {
    const q = TRICKS.find(x => x.id === d.q);
    st.quiz[q.id] = { a: d.a, right: (d.a === "real") === q.real }; save();
    renderGame(false); const c = planEl.querySelectorAll(".card")[TRICKS.indexOf(q) + 1]; if (c) { const s2 = c.querySelector("[role=status]"); if (s2) { s2.tabIndex = -1; s2.focus(); } }
    return;
  }
  if (d.copy) { copyText($(d.copy).value, b); return; }
  if (b.id === "chatSend") { sendChat(); return; }
  if (b.id === "forgetKey") { st.key = ""; save(); $("orKey").value = ""; return; }
  if (b.id === "editBtn") { form.scrollIntoView({ block: "start" }); return; }
  if (b.id === "resetBtn" && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = t(T.resetQ); return; }
  if (b.id === "resetBtn") { st = { lang: st.lang, ans: {}, done: {}, steps: {}, quiz: {}, bot: "Bit", tab: "quests", model: st.model, key: st.key }; chat = []; flash = {}; save(); render(); window.scrollTo(0, 0); }
});
planEl.addEventListener("change", e => {
  if (e.target.dataset.all) { const id = e.target.dataset.all; keepOpen(() => finish(id), `details[data-id="${id}"] summary`); }
});
planEl.addEventListener("input", e => {
  if (e.target.id === "botname") { st.bot = e.target.value.trim() || "Bit"; save(); }
});
planEl.addEventListener("focusout", e => { if (e.target.id === "botname") { const sv = planEl.querySelector(".hq svg"); if (sv) sv.setAttribute("aria-label", st.bot); } });
sosBtn.addEventListener("click", () => { const open = sos.hidden; sos.hidden = !open; sosBtn.setAttribute("aria-expanded", String(open)); if (open) sos.scrollIntoView({ block: "nearest" }); });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { st.lang = b.dataset.lang; flash = {}; save(); render(); }));
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
