<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your sauna in 3D · Aufguss Studio</title>
<meta name="description" content="Draw your sauna, see it in 3D, pour water and watch the steam and the waving.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#b5763f">
<style>
  :root { --bg: #fbf6ef; --card: #fffdf9; --ink: #2f2119; --muted: #6e5a4c; --line: #e3d4c3; --wood: #b5763f; --accent: #7a3e1d; --ember: #c0471f; --tap: 44px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1612; --card: #271e18; --ink: #f3e9df; --muted: #c2ad9b; --line: #4a3a2e; --wood: #d39a62; --accent: #e8a477; --ember: #ff7a4d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 16px; line-height: 1.4; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px 4px; }
  header h1 { font-size: 1.25rem; margin: 0; flex: 1; }
  header a { color: var(--accent); }
  main { display: grid; gap: 12px; padding: 0 12px 28px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 960px) { main { grid-template-columns: 1fr 1fr; align-items: start; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
  button, select { min-height: var(--tap); min-width: var(--tap); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 0 12px; font: inherit; font-size: .95rem; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary { background: var(--wood); color: #fff; border: 0; font-weight: 700; }
  button:disabled { opacity: .45; cursor: default; }
  .ed-tools, .ed-row, .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .edcv { display: block; width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); touch-action: none; }
  .ed-grid { display: grid; gap: 6px; margin-top: 6px; }
  .ed-grid label { display: grid; grid-template-columns: 9em 1fr 4.5em; align-items: center; gap: 8px; }
  input[type=range] { width: 100%; min-height: 32px; accent-color: var(--wood); }
  input[type=number] { width: 5.5em; min-height: 40px; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; background: var(--card); color: var(--ink); }
  .hint { color: var(--muted); font-size: .9rem; }
  .s3cv { display: block; width: 100%; height: min(70vh, 560px); border-radius: 12px; background: radial-gradient(ellipse at 50% 40%, rgba(181,118,63,0.15), transparent 70%); touch-action: none; cursor: grab; }
  .guest { display: grid; gap: 2px; font-size: .92rem; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
  .guest em { color: var(--ember); font-style: normal; font-weight: 700; }
  .warn { color: var(--ember); font-weight: 600; }
  ul { padding-left: 1.2em; } li { margin: 5px 0; }
</style>
</head>
<body>
<header>
  <h1 data-en="Your sauna in 3D" data-de="Deine Sauna in 3D">Your sauna in 3D</h1>
  <a href="index.html" data-en="Back to the app" data-de="Zurück zur App">Back to the app</a>
</header>
<main>
  <section class="card cabins">
    <div class="ed-row">
      <label><span data-en="Sauna" data-de="Sauna">Sauna</span> <select id="cab"></select></label>
      <input id="cabName" type="text" aria-label="Name" style="min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font:inherit;background:var(--card);color:var(--ink);flex:1;min-width:8em">
      <button id="cabNew" data-en="New sauna" data-de="Neue Sauna">New sauna</button>
      <button id="cabDel" data-en="Delete" data-de="Löschen">Delete</button>
    </div>
    <p class="hint" data-en="All saunas stay on this phone. A spa with several infusion cabins gets one entry each." data-de="Alle Saunen bleiben auf diesem Handy. Ein Bad mit mehreren Aufgusskabinen bekommt für jede einen Eintrag."></p>
  </section>
  <section class="card">
    <h2 data-en="1 · Draw the floor plan" data-de="1 · Grundriss zeichnen">1 · Draw the floor plan</h2>
    <div id="editor"></div>
  </section>
  <section class="card">
    <h2 data-en="2 · Pour and wave" data-de="2 · Aufgießen und wedeln">2 · Pour and wave</h2>
    <p class="hint" data-en="The 3D room follows your plan. Start an infusion: pour, wait for the steam mushroom, then the sauna master waves across the stove and walks one loop around it." data-de="Der 3D-Raum folgt deinem Grundriss. Starte einen Aufguss: aufgießen, auf den Dampfpilz warten, dann wedelt die Saunameisterin über den Ofen und geht eine Runde um ihn herum."></p>
    <div id="s3"></div>
  </section>
  <section class="card">
    <h2 data-en="At the hottest moment" data-de="Im heißesten Moment">At the hottest moment</h2>
    <ul>
      <li data-en="Your skin is the coldest surface in the room, so the steam condenses on you. Ears burn first: thin, little blood, high up." data-de="Deine Haut ist die kälteste Fläche im Raum, also kondensiert der Dampf auf dir. Die Ohren brennen zuerst: dünn, wenig durchblutet, weit oben."></li>
      <li data-en="Wiping the ears takes away the hot water film; covering them with your hands helps too." data-de="Ohren abwischen nimmt den heißen Wasserfilm weg; die Hände darüberlegen hilft auch."></li>
      <li data-en="Breathe slowly through the nose, head lowered. Mouth and throat are wet, cool surfaces too: don't gulp the steam." data-de="Langsam durch die Nase atmen, Kopf gesenkt. Mund und Rachen sind auch nasse, kühle Flächen: den Dampf nicht einsaugen."></li>
      <li data-en="Take off metal: glasses, rings, chains heat up and can burn." data-de="Metall ablegen: Brille, Ringe, Ketten werden heiß und können brennen."></li>
      <li data-en="Too much? Move down a row or leave. Nobody has to stay." data-de="Zu viel? Eine Reihe tiefer setzen oder gehen. Niemand muss bleiben."></li>
    </ul>
  </section>
</main>
<script src="data.js"></script>
<script src="plan.js"></script>
<script src="sauna3d.js"></script>
<script>
(function () {
  let lang = "en"; try { lang = (JSON.parse(localStorage.getItem("aufguss.lang")) || navigator.language || "en").slice(0, 2) === "de" ? "de" : "en"; } catch (e) { lang = (navigator.language || "en").slice(0, 2) === "de" ? "de" : "en"; }
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-en]").forEach((el) => (el.textContent = lang === "de" ? el.dataset.de : el.dataset.en));
  const rules = (window.AUFGUSS_DATA && window.AUFGUSS_DATA.RULES) || { waterPerM3: 30 };
  const qid = new URLSearchParams(location.search).get("id"); if (qid && AufgussPlan.cabins().find((c) => c.id === qid)) AufgussPlan.setCurrent(qid);
  const cab = document.getElementById("cab"), nameEl = document.getElementById("cabName");
  function cabUI() { const cur = AufgussPlan.currentId(); cab.innerHTML = AufgussPlan.cabins().map((c) => `<option value="${c.id}" ${c.id === cur ? "selected" : ""}>${c.name.replace(/</g, "&lt;")}</option>`).join(""); nameEl.value = AufgussPlan.cabins().find((c) => c.id === cur).name; }
  cabUI();
  cab.onchange = () => { AufgussPlan.setCurrent(cab.value); location.search = "?id=" + cab.value; };
  nameEl.onchange = () => { AufgussPlan.renameCabin(AufgussPlan.currentId(), nameEl.value.trim() || "Sauna"); cabUI(); };
  document.getElementById("cabNew").onclick = () => { const c = AufgussPlan.addCabin((lang === "de" ? "Sauna " : "Sauna ") + (AufgussPlan.cabins().length + 1)); location.search = "?id=" + c.id; };
  document.getElementById("cabDel").onclick = () => { if (AufgussPlan.cabins().length < 2) return; if (!confirm(lang === "de" ? "Diese Sauna löschen?" : "Delete this sauna?")) return; AufgussPlan.removeCabin(AufgussPlan.currentId()); location.search = ""; };
  let s3 = null, timer = 0;
  const ed = AufgussPlan.editor(document.getElementById("editor"), { lang, waterPerM3: rules.waterPerM3, onChange(plan) { clearTimeout(timer); timer = setTimeout(() => s3 && s3.rebuild(JSON.parse(JSON.stringify(plan))), 400); } });
  s3 = AufgussSauna3D.mount(document.getElementById("s3"), lang);
  window.__s3 = s3;
})();
</script>
</body>
</html>
