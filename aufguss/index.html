<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufguss Studio</title>
<meta name="description" content="Design your sauna infusion, round by round. Free, offline, no account.">
<meta name="theme-color" content="#7a3e1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #fbf6ef; --card: #fffdf9; --ink: #2f2119; --muted: #6e5a4c; --line: #e3d4c3;
    --wood: #b5763f; --ember: #c0471f; --accent: #7a3e1d; --cool: #3f6f80;
    --r: 14px; --tap: 44px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1612; --card: #271e18; --ink: #f3e9df; --muted: #c2ad9b; --line: #4a3a2e; --wood: #d39a62; --ember: #ff7a4d; --accent: #e8a477; --cool: #8cc3d4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.45; }
  header.top { padding: 14px 16px 6px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  header.top h1 { margin: 0; font-size: 1.45rem; letter-spacing: .2px; }
  header.top p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
  .lang { display: flex; gap: 4px; }
  .lang button, .filters button, nav.tabs button, .controls button { min-height: var(--tap); min-width: var(--tap); border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 0 12px; font: inherit; font-size: .95rem; cursor: pointer; }
  [aria-pressed="true"], [aria-selected="true"] { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
  nav.tabs { display: flex; gap: 6px; padding: 6px 16px 10px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  nav.tabs button { flex: 1; }
  main { padding: 0 12px 40px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 0 0 14px; }
  h2 { font-size: 1.15rem; margin: 4px 0 10px; } h2 small { font-weight: 400; color: var(--muted); font-size: .85rem; display: block; }
  label { display: block; font-size: .92rem; color: var(--muted); margin: 8px 0 0; }
  label.row { display: flex; justify-content: space-between; color: var(--ink); }
  output { font-weight: 600; }
  input[type=range] { width: 100%; height: var(--tap); accent-color: var(--accent); }
  select, input[type=text] { width: 100%; min-height: var(--tap); font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  fieldset.scents { border: 0; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  fieldset.scents legend { font-size: .92rem; color: var(--muted); padding: 0; margin-bottom: 4px; }
  .warn { background: color-mix(in srgb, var(--ember) 14%, transparent); border-left: 4px solid var(--ember); padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: .95rem; }
  .hint { color: var(--muted); font-size: .9rem; }
  ol.timeline { list-style: none; padding: 0; margin: 0; }
  .ph { display: grid; grid-template-columns: 52px 1fr; gap: 10px; margin-bottom: 10px; }
  .ph .when { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; padding-top: 14px; text-align: right; }
  .ph .body { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px;
    border-left: 6px solid color-mix(in srgb, var(--ember) calc(var(--heat) * 100%), var(--cool)); }
  .ph h3 { margin: 0 0 4px; font-size: 1.02rem; } .ph h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .ph p { margin: 4px 0; font-size: .95rem; }
  .ph-airing .body, .ph-intro .body, .ph-closing .body, .ph-opening .body { border-left-color: var(--cool); }
  .ph-abFinal .body { border-left-color: var(--ember); }
  .tech { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .chip { min-height: var(--tap); border-radius: 999px; border: 1px solid var(--wood); background: color-mix(in srgb, var(--wood) 14%, var(--card)); color: var(--ink); font: inherit; font-weight: 600; padding: 0 14px; cursor: pointer; }
  .swap { min-height: var(--tap); min-width: var(--tap); border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .tech .lbl { color: var(--muted); font-size: .88rem; flex-basis: 100%; }
  .verify { display: inline-block; min-width: 1.3em; border-radius: 50%; background: var(--line); color: var(--ink); font-size: .8rem; text-align: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  ul.lib { list-style: none; padding: 0; margin: 0; }
  ul.lib li { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; padding: 4px 12px 8px; }
  .libitem { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: inherit; padding: 8px 0 2px; cursor: pointer; min-height: var(--tap); }
  .libitem strong { display: block; font-size: 1.02rem; }
  .meta { display: block; color: var(--muted); font-size: .88rem; }
  label.cando { display: flex; align-items: center; gap: 8px; color: var(--ink); min-height: var(--tap); margin: 0; }
  label.cando input { width: 24px; height: 24px; accent-color: var(--accent); }
  dialog#sheet { border: 0; padding: 0; width: min(680px, 100vw); max-height: 92vh; border-radius: 18px 18px 0 0; margin: auto auto 0; background: var(--card); color: var(--ink); }
  .labbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--wood); color: #fff; font-weight: 700; text-decoration: none; }
  button.primary { background: var(--wood); color: #fff; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; min-height: 44px; }
  .me { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
  .me svg { width: 96px; height: 84px; background: var(--bg); border-radius: 12px; }
  .me .code { font-size: 1.15rem; font-weight: 700; }
  .me p { margin: 4px 0; }
  .quiz fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 12px; padding: 10px 12px; }
  .quiz legend { font-weight: 700; padding: 0 4px; }
  .quiz label { display: flex; gap: 10px; align-items: center; min-height: 44px; }
  .quiz input { width: 22px; height: 22px; flex: none; }
  .pickanimal { display: flex; gap: 8px; flex-wrap: wrap; }
  .pickanimal button { display: flex; flex-direction: column; align-items: center; padding: 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 96px; }
  .pickanimal button[aria-pressed="true"] { border-color: var(--wood); }
  .pickanimal svg { width: 84px; height: 72px; }
  dialog::backdrop { background: rgba(20, 12, 8, .5); }
  .sheet-in { padding: 12px 16px 24px; }
  .sheet-in header { display: flex; justify-content: space-between; align-items: center; }
  .sheet-in h2 { margin: 0; }
  .x { min-width: var(--tap); min-height: var(--tap); border: 0; background: none; color: var(--ink); font-size: 1.3rem; cursor: pointer; }
  #demoCanvas { width: 100%; height: 300px; display: block; background: color-mix(in srgb, var(--wood) 8%, var(--card)); border-radius: 12px; margin: 8px 0; }
  .controls { display: flex; gap: 12px; align-items: center; }
  .controls label { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); }
  .foot { text-align: center; color: var(--muted); font-size: .85rem; }
  .clipbtn { min-height: var(--tap); border-radius: 999px; border: 1px solid var(--wood); background: var(--card); color: var(--ink); font: inherit; padding: 0 14px; cursor: pointer; margin-top: 8px; }
  .cliphost { aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-top: 8px; }
  .cliphost:empty { display: none; }
  .figpick { display: flex; align-items: center; gap: 8px; color: var(--ink); margin: 6px 0; }
  .figpick select { width: auto; }
  .figwrap canvas#demoCanvas { margin: 0; }
  .k-note { border-left: 3px solid var(--cool); padding-left: 8px; color: var(--muted); }
  .k-music { color: var(--muted); }
  .code { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); margin-right: 2px; }
  :focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
  <header class="top">
    <div><h1>Aufguss Studio</h1><p id="tagline"></p></div>
    <div class="lang" role="group" aria-label="Language / Sprache">
      <button data-lang="en">EN</button><button data-lang="de">DE</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="Design" data-view="design" aria-selected="true"></button>
    <button role="tab" data-tab="Tech" data-view="library" aria-selected="false"></button>
    <button role="tab" data-tab="About" data-view="about" aria-selected="false"></button>
  </nav>
  <main>
    <section class="view" id="design"></section>
    <section class="view" id="library" hidden></section>
    <section class="view" id="about" hidden></section>
  </main>
  <dialog id="sheet" aria-label="Technique"></dialog>
  <script src="techniques.js"></script>
  <script src="data.js"></script>
  <script src="pose-engine.js"></script>
  <script src="demo.js"></script>
  <script src="clip.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
